syntax = "proto3";

package user;
option go_package = "./user";

message LoginReq {
  string username = 1;
  string password = 2;
}

message LoginResp {
  string token = 1;
  int64 userId = 2;
}

message RegisterReq {
  string username = 1;
  string password = 2;
}

message RegisterResp {
  bool success = 1;
  int64 userId = 2;
  string msg = 3;
}

service User {
  rpc login(LoginReq) returns(LoginResp);
  rpc register(RegisterReq) returns(RegisterResp);
}
